services:
  # Base Diarization Service Configuration
  diarization-service:
    &base-diarization-service
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: cpu
    image: mycelia-diarizator:cpu
    init: true
    env_file:
      - .env
    ports:
      - "${SPEAKER_SERVICE_PORT:-8085}:${SPEAKER_SERVICE_PORT:-8085}"
    volumes:
      - ./src:/app/src
      - ./model_cache:/models
      - ./debug:/app/debug
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      - SPEAKER_SERVICE_HOST=${SPEAKER_SERVICE_HOST:-0.0.0.0}
      - SPEAKER_SERVICE_PORT=${SPEAKER_SERVICE_PORT:-8085}
      - COMPUTE_MODE=cpu
      # Pin the runtime uv extra. env_file may contain a server-oriented CUDA
      # value, but it must never override the native Mac CPU image flavor.
      - PYTORCH_CUDA_VERSION=cpu
      - AUDIO_BACKEND=${AUDIO_BACKEND:-soundfile}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SPEAKER_SERVICE_PORT:-8085}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GPU Profile Configuration
  diarization-service-gpu:
    <<: *base-diarization-service
    profiles: ["gpu"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu126}
    image: mycelia-diarizator:${PYTORCH_CUDA_VERSION:-cu126}
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      - SPEAKER_SERVICE_HOST=${SPEAKER_SERVICE_HOST:-0.0.0.0}
      - SPEAKER_SERVICE_PORT=${SPEAKER_SERVICE_PORT:-8085}
      - COMPUTE_MODE=gpu
      - PYTORCH_CUDA_VERSION=${PYTORCH_CUDA_VERSION:-cu126}
      - AUDIO_BACKEND=${AUDIO_BACKEND:-soundfile}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  
