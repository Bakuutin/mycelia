services:
  # Base Diarization Service Configuration
  diarization-service:
    &base-diarization-service
    profiles: ["cpu"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cpu}
    image: diarization-service:latest
    env_file:
      - .env
    ports:
      - "${SPEAKER_SERVICE_PORT:-8085}:${SPEAKER_SERVICE_PORT:-8085}"
    volumes:
      - ./src:/app/src
      - ./model_cache:/models
      - ./debug:/app/debug
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - SPEAKER_SERVICE_HOST=${SPEAKER_SERVICE_HOST:-0.0.0.0}
      - SPEAKER_SERVICE_PORT=${SPEAKER_SERVICE_PORT:-8085}
      - COMPUTE_MODE=${COMPUTE_MODE:-cpu}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # GPU Profile Configuration
  diarization-service-gpu:
    <<: *base-diarization-service
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu121}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  
