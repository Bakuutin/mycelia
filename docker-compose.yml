services:
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --protected-mode yes
      - --bind 0.0.0.0
    volumes:
      - redis_data:/data
    restart: always
    environment:
      - REDIS_PASSWORD
  mongo:
    image: mongo:8.2
    entrypoint: ["/mongo-entrypoint.sh"]
    command: mongod --config /etc/mongod.conf
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./misc/mongo/mongod.conf:/etc/mongod.conf:ro
      - ./misc/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      - ./misc/mongo/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    
  # mongo-search:
  #   image: mongodb/mongodb-community-search:latest
  #   entrypoint: ["/mongot-entrypoint.sh"]
  #   ports:
  #     - "27028:27028"
  #     - "9946:9946"
  #   volumes:
  #     - mongo_search_data:/data/mongot
  #     - ./misc/mongo/mongot.conf:/mongot-community/config.default.yml:ro
  #     - ./misc/mongo/mongot-entrypoint.sh:/mongot-entrypoint.sh:ro
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME
  #     - MONGO_INITDB_ROOT_PASSWORD
  #   depends_on:
  #     - mongo
  frontend:
    image: bakuutin/mycelia-frontend:dev
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.${FRONTEND_MODE:-prod}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: always
    volumes:
      - ./frontend:/app
      - ./interfaces:/app/interfaces

  backend:
    image: bakuutin/mycelia-backend:dev
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-5173}:5173"
    restart: always
    command: deno task dev
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_WORKER_URL: http://python-worker:8000
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.2'
          memory: 1G

  python-worker:
    image: bakuutin/mycelia-python:dev
    build:
      context: .
      dockerfile: ./python/Dockerfile
    environment:
      MYCELIA_URL: http://backend:5173
    volumes:
      - ./python:/app
      - worker_data:/root/.cache
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
            cpus: '0.5'
            memory: 1G

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-4433}:4433"
    volumes:
      - ./misc/nginx/templates:/etc/nginx/templates:ro
      - ./misc/nginx/ssl:/etc/nginx/ssl:ro
    restart: always



volumes:
  mongo_data:
  mongo_search_data:
  redis_data:
  worker_data:
