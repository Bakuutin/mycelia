services:
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --protected-mode yes
      - --bind 0.0.0.0
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD
  mongo:
    image: mongo:8.2
    entrypoint: ["/mongo-entrypoint.sh"]
    command: mongod --config /etc/mongod.conf
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./misc/mongod.conf:/etc/mongod.conf:ro
      - ./misc/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
      - ./misc/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
  mongo-search:
    image: mongodb/mongodb-community-search:latest
    entrypoint: ["/mongot-entrypoint.sh"]
    ports:
      - "27028:27028"
      - "9946:9946"
    volumes:
      - mongo_search_data:/data/mongot
      - ./misc/mongot.conf:/mongot-community/config.default.yml:ro
      - ./misc/mongot-entrypoint.sh:/mongot-entrypoint.sh:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    depends_on:
      - mongo

  frontend:
    image: bakuutin/mycelia-frontend:dev
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.${FRONTEND_MODE:-prod}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - ./interfaces:/app/interfaces

  backend:
    image: bakuutin/mycelia-backend:dev
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-5173}:5173"
    command: deno task dev
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_WORKER_URL: http://python-worker:8000
    volumes:
      - ./backend:/app

  python-worker:
    image: bakuutin/mycelia-python:dev
    build:
      context: .
      dockerfile: ./python/Dockerfile
    environment:
      MYCELIA_URL: http://backend:5173
    depends_on:
      - backend
    ports:
      - "${PYTHON_WORKER_PORT:-8000}:8000"
    volumes:
      - ./python:/app
      - worker_data:/root/.cache

volumes:
  mongo_data:
  mongo_search_data:
  redis_data:
  worker_data:
