services:
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --protected-mode yes
      - --bind 0.0.0.0
    volumes:
      - ${REDIS_HOST_PATH:-redis_data}:/data
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD
    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
      ]
      interval: 10s
      timeout: 3s
      # Redis refuses connections until the RDB is fully loaded, which takes
      # well over 10s once the dataset grows (~13s at 345MB on a bind mount).
      # A short start_period reports it unhealthy during normal startup and
      # makes every dependent service flap along with it.
      start_period: 120s
      retries: 6
  mongo:
    image: mongo:8.2
    entrypoint: ["/mongo-entrypoint.sh"]
    command: mongod --config /etc/mongod.conf
    volumes:
      - ${MONGO_HOST_PATH:-mongo_data}:/data/db
      - ./misc/mongo/mongod.conf:/etc/mongod.conf:ro
      - ./misc/mongo/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    ports:
      - "27017:27017"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
    healthcheck:
      # The native Go client avoids the short CPU/PID burst caused by starting
      # Node-based mongosh every 30 seconds. Exec form also guarantees Docker
      # stops the actual probe on timeout instead of orphaning shell children.
      test:
        - CMD
        - mongostat
        - --rowcount=1
        - --noheaders
        - --uri=mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=1500&connectTimeoutMS=1500&socketTimeoutMS=1500
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 4

  # mongo-search:
  #   image: mongodb/mongodb-community-search:latest
  #   entrypoint: ["/mongot-entrypoint.sh"]
  #   volumes:
  #     - ${MONGO_SEARCH_HOST_PATH:-mongo_search_data}:/data/mongot
  #     - ./misc/mongo/mongot.conf:/mongot-community/config.default.yml:ro
  #     - ./misc/mongo/mongot-entrypoint.sh:/mongot-entrypoint.sh:ro
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME
  #     - MONGO_INITDB_ROOT_PASSWORD
  #   depends_on:
  #     - mongo

  pbm-agent:
    image: percona/percona-backup-mongodb:2.12.0
    profiles: ["backup"]
    environment:
      PBM_MONGODB_URI: "mongodb://${PBM_USER:-pbmuser}:${PBM_PASSWORD}@mongo:27017/?authSource=admin&directConnection=true"
    volumes:
      - ${PBM_BACKUP_HOST_PATH:-pbm_backup_data}:/data/backups
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: bakuutin/mycelia-frontend:${APP_MODE:-prod}
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.${APP_MODE:-prod}
    expose:
      - "8080"
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - ./myceliasdk:/app/myceliasdk

  backend:
    image: bakuutin/mycelia-backend:dev
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    expose:
      - "5173"
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: deno task ${APP_MODE:-prod}
    env_file:
      - .env
    environment:
      # Keep readiness diagnostics aligned with the single mode that selects
      # both the frontend image and the backend command.
      APP_MODE: ${APP_MODE:-prod}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_WORKER_URL: http://python-worker:8000
      # Source audio paths live on the macOS host and are not mounted into the
      # container worker. Route only ingestion to the authenticated host service.
      INGESTION_WORKER_URL: ${INGESTION_WORKER_URL:-http://host.docker.internal:8001}
      DIARIZATION_SERVER_URL: ${DIARIZATION_SERVER_URL:-http://diarizator:8085}
      # Snapshot the same request window into newly enqueued jobs so their
      # outer timeout matches the Python worker's actual sequence size.
      DIARIZATION_MAX_SEQUENCE_CHUNKS: ${DIARIZATION_MAX_SEQUENCE_CHUNKS:-2}
    volumes:
      - ./backend:/app
      - ./myceliasdk:/myceliasdk
      - ./docs:/docs:ro
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:5173/readiness'); if (!response.ok) Deno.exit(1);"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.2"
          memory: 1G

  python-worker:
    image: bakuutin/mycelia-python:dev
    build:
      context: .
      dockerfile: ./python/Dockerfile
    environment:
      MYCELIA_URL: http://backend:5173
      MYCELIA_CLIENT_ID: ${MYCELIA_CLIENT_ID}
      MYCELIA_TOKEN: ${MYCELIA_TOKEN}
      STT_SERVER_URL: ${STT_SERVER_URL:-}
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      DIARIZATION_SERVER_URL: ${DIARIZATION_SERVER_URL:-http://diarizator:8085}
      # Keep local CPU inference inside Docker Desktop's memory envelope.
      # GPU/large-memory deployments can explicitly raise this back to 6.
      DIARIZATION_MAX_SEQUENCE_CHUNKS: ${DIARIZATION_MAX_SEQUENCE_CHUNKS:-2}
      # A recording lease prevents concurrent jobs from decoding and claiming
      # the same source. Prefetch is bounded to one prepared sequence and can be
      # disabled independently for a conservative rollout.
      DIARIZATION_RECORDING_LEASE_SECONDS: ${DIARIZATION_RECORDING_LEASE_SECONDS:-600}
      DIARIZATION_PREFETCH_SEQUENCES: ${DIARIZATION_PREFETCH_SEQUENCES:-0}
      SPEAKER_SIMILARITY_THRESHOLD: ${SPEAKER_SIMILARITY_THRESHOLD:-0.35}
      DIARIZATION_CONTINUITY_THRESHOLD: ${DIARIZATION_CONTINUITY_THRESHOLD:-0.75}
      # Chunks further apart than this start a new sequence instead of being
      # joined with padded silence.
      DIARIZATION_MAX_GAP_SECONDS: ${DIARIZATION_MAX_GAP_SECONDS:-60}
    volumes:
      - ./python:/app
      - ${WORKER_HOST_PATH:-worker_data}:/root/.cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # Optional local CPU diarizator. Keeping it in the main Compose project gives
  # backend and python-worker a stable service-DNS route and avoids unreliable
  # Docker Desktop host-port hairpinning through host.docker.internal.
  diarizator:
    profiles: ["diarization"]
    image: mycelia-diarizator:cpu
    build:
      context: ./diarizator
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: cpu
    init: true
    ports:
      - "${SPEAKER_SERVICE_PORT:-8085}:${SPEAKER_SERVICE_PORT:-8085}"
    volumes:
      - ./diarizator/src:/app/src
      - ./diarizator/model_cache:/models
      - ./diarizator/debug:/app/debug
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-pyannote/wespeaker-voxceleb-resnet34-LM}
      DIARIZATION_MODEL_REVISION: ${DIARIZATION_MODEL_REVISION:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      DIARIZATION_SEGMENTATION_BATCH_SIZE: ${DIARIZATION_SEGMENTATION_BATCH_SIZE:-1}
      DIARIZATION_EMBEDDING_BATCH_SIZE: ${DIARIZATION_EMBEDDING_BATCH_SIZE:-1}
      DIARIZATION_SEGMENT_EMBEDDING_BATCH_SIZE: ${DIARIZATION_SEGMENT_EMBEDDING_BATCH_SIZE:-1}
      DIARIZATION_REQUEST_CONCURRENCY: ${DIARIZATION_REQUEST_CONCURRENCY:-1}
      DIARIZATION_MAX_QUEUED_REQUESTS: ${DIARIZATION_MAX_QUEUED_REQUESTS:-1}
      SPEAKER_SERVICE_HOST: ${SPEAKER_SERVICE_HOST:-0.0.0.0}
      SPEAKER_SERVICE_PORT: ${SPEAKER_SERVICE_PORT:-8085}
      COMPUTE_MODE: cpu
      PYTORCH_CUDA_VERSION: cpu
      AUDIO_BACKEND: ${AUDIO_BACKEND:-soundfile}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsS http://localhost:$${SPEAKER_SERVICE_PORT:-8085}/ready",
      ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    entrypoint: ["/nginx-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${NGINX_PORT:-4433}:4433"
      - "${NGINX_HTTP_PORT:-3210}:80"
    volumes:
      - ./misc/nginx/templates:/etc/nginx/templates:ro
      - ./misc/nginx/ssl:/etc/nginx/ssl
      - ./misc/nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
  mongo_search_data:
  worker_data:
  pbm_backup_data:
