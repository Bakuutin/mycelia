[project]
name = "simple-speaker-recognition"
version = "1.0.0"
description = "Minimal pyannote diarization service with embeddings"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "scipy>=1.10.0",
    "pyannote.audio==3.1.1",
    "python-multipart>=0.0.6",
    "soundfile>=0.12",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",  # Required for seeded clustering
]

[project.optional-dependencies]
cpu = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

cu121 = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

cu126 = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

cu128 = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu121" },
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu121", extra = "cu121" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
simple-speaker-service = "simple_speaker_recognition.api.service:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
]

test = [
    "pytest",
    "requests",
]

[tool.isort]
profile = "black"
