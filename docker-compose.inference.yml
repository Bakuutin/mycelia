services:
  # ===========================================
  # WHISPER - Speech-to-Text
  # ===========================================
  whisper-stt:
    build:
      context: ./python/whisper_server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
    image: mycelia-whisper:latest
    container_name: whisper-stt
    profiles: ["gpu", "cpu"]
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8081}:8081"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - WHISPER_DEVICE=cuda
      - API_KEY=${API_KEY:-}
    volumes:
      - whisper_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  whisper-stt-cpu:
    build:
      context: ./python/whisper_server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.10-slim
    image: mycelia-whisper-cpu:latest
    container_name: whisper-stt
    profiles: ["cpu-only"]
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8081}:8081"
    environment:
      - WHISPER_DEVICE=cpu
      - API_KEY=${API_KEY:-}
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # DIARIZATION - Speaker Recognition
  # ===========================================
  diarization:
    build:
      context: ./python/diarization
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: ${PYTORCH_CUDA_VERSION:-cu121}
    image: mycelia-diarization:latest
    container_name: diarization
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${DIARIZATION_PORT:-8085}:8085"
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - COMPUTE_MODE=gpu
      - SPEKAER_SERVICE_PORT=8085
    volumes:
      - diarization_models:/models
      - diarization_debug:/app/debug
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  diarization-cpu:
    build:
      context: ./python/diarization
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: cpu
    image: mycelia-diarization-cpu:latest
    container_name: diarization
    profiles: ["cpu", "cpu-only"]
    restart: unless-stopped
    ports:
      - "${DIARIZATION_PORT:-8085}:8085"
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - COMPUTE_MODE=cpu
      - SPEAKER_SERVICE_PORT=8085
    volumes:
      - diarization_models:/models
      - diarization_debug:/app/debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # OLLAMA - LLM Inference
  # ===========================================
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["cpu", "cpu-only"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  whisper_cache:
  diarization_models:
  diarization_debug:
  ollama_data:
