services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1-gpu
    environment:
      - ASR_MODEL=large-v3-turbo
      - ASR_DEVICE=cuda
      - ASR_ENGINE=faster_whisper
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MODEL_IDLE_TIMEOUT=300
    volumes:
      - ./docker/models:/app/models
      - ./docker/whisper:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:0.13.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./docker/ollama:/root/.ollama

  diarization:
    build:
      context: ../diarizator
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: cu126
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      - COMPUTE_MODE=gpu
      - SPEAKER_SERVICE_HOST=0.0.0.0
      - SPEAKER_SERVICE_PORT=8085
      - LOG_LEVEL=INFO
    volumes:
      - ../diarizator/src:/app/src        # Hot reload
      - ./docker/diarization-models:/models
    ports:
      - "8085:8085"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "${PROXY_PORT:-8000}:8000"
    volumes:
      - ./proxy:/app
    environment:
      - API_KEY=${PROXY_API_KEY}
      - WHISPER_SERVICE_URL=http://whisper:9000
      - OLLAMA_SERVICE_URL=http://ollama:11434
