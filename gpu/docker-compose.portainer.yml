services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1-gpu
    environment:
      ASR_MODEL: ${ASR_MODEL:-large-v3-turbo}
      ASR_ENGINE: faster_whisper
      ASR_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_IDLE_TIMEOUT: ${MODEL_IDLE_TIMEOUT:-300}
    volumes:
      - whisper_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  proxy:
    image: sky-mycelia-stt-proxy:latest
    build:
      context: ./proxy
      dockerfile: Dockerfile
    depends_on:
      - whisper
    ports:
      - "${PROXY_PORT:-8001}:8000"
    environment:
      API_KEY: ${PROXY_API_KEY:?Set PROXY_API_KEY in Portainer}
      WHISPER_SERVICE_URL: http://whisper:9000
      ASR_MODEL: ${ASR_MODEL:-large-v3-turbo}
      WHISPER_VAD_FILTER: ${WHISPER_VAD_FILTER:-true}
      MODEL_IDLE_TIMEOUT: ${MODEL_IDLE_TIMEOUT:-300}
    restart: unless-stopped

  diarization:
    image: sky-mycelia-diarizator:cu126
    build:
      context: ../diarizator
      dockerfile: Dockerfile
      args:
        PYTORCH_CUDA_VERSION: cu126
    ports:
      - "${DIARIZATION_PORT:-8085}:8085"
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in Portainer}
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}
      DIARIZATION_IDLE_TIMEOUT_SECONDS: ${DIARIZATION_IDLE_TIMEOUT_SECONDS:-120}
      COMPUTE_MODE: gpu
      PYTORCH_CUDA_VERSION: cu126
      AUDIO_BACKEND: soundfile
      SPEAKER_SERVICE_HOST: 0.0.0.0
      SPEAKER_SERVICE_PORT: 8085
      LOG_LEVEL: INFO
    volumes:
      - diarization_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  whisper_cache:
  diarization_models:
