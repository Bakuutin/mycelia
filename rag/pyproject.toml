[project]
name = "mycelia-rag"
version = "0.1.0"
description = "Standalone Qdrant-backed RAG projection for Mycelia"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "pydantic-settings>=2.6.0,<3.0",
  "pymongo>=4.10.0,<5.0",
  "qdrant-client[fastembed]>=1.13.0,<2.0",
  "uvicorn[standard]>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0",
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
  "ruff>=0.9.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelia_rag"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
